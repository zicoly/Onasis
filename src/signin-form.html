<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Document</title>
</head>
<body>
    <section class="flex items-center justify-center h-screen bg-black">

    <div class="w-full max-w-md">

        <h1 class="text-4xl font-bold text-white">
            Sign Up For Free.
        </h1>

        <p class="text-gray-400 mt-3 mb-10">
            Let's sign up quickly to get started.
        </p>

        <form class="space-y-6">

            <!-- Username -->

            <div>

                <label class="text-sm text-gray-300 block mb-2">
                    Username
                </label>

                <input
                    type="text"
                    placeholder="X_AE_A_13b"
                    class="w-full rounded-full border border-gray-700 bg-[#111827] px-5 py-4 text-white outline-none focus:border-violet-500">

            </div>

            <!-- Email -->

            <div>

                <label class="text-sm text-gray-300 block mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="example@gmail.com"
                    class="w-full rounded-full border border-violet-600 bg-[#111827] px-5 py-4 text-white outline-none focus:border-violet-500">

            </div>

            <!-- Password -->

            <div>

                <label class="text-sm text-gray-300 block mb-2">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="********"
                    class="w-full rounded-full border border-gray-700 bg-[#111827] px-5 py-4 text-white outline-none">

            </div>

            <!-- Strength -->

            <div>

                <div class="flex gap-2">

                    <div class="h-1 flex-1 rounded bg-green-500"></div>
                    <div class="h-1 flex-1 rounded bg-green-500"></div>
                    <div class="h-1 flex-1 rounded bg-green-500"></div>
                    <div class="h-1 flex-1 rounded bg-gray-700"></div>

                </div>

                <p class="text-sm text-gray-400 mt-2">
                    Password strength:
                    <span class="text-green-400">
                        Strong
                    </span>
                </p>

            </div>

            <!-- Button -->

            <button
                class="w-full py-4 rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 text-white font-semibold hover:opacity-90 transition">

                Sign Up

            </button>

        </form>

        <p class="text-center text-gray-400 mt-8">

            Already have an account?

            <a href="#" class="text-violet-500 hover:underline">
                Sign In.
            </a>

        </p>

        <button
            class="mt-8 w-full rounded-full border border-gray-700 py-4 text-white hover:bg-gray-900 transition">

            Sign Up With Google

        </button>

    </div>

</section>
</body>
</html>
