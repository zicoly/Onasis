<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./output.css" />
    <title>Signup form</title>
  </head>
  <body class="min-h-screen bg-gray-950 text-white">
    <div class="flex min-h-screen">
      <!-- left side -->
      <section
        class="w-1/2 items-center bg-linear-to-br from-fuchsia-300 via-purple-500 to-indigo-900 hidden md:block"
      >
        <div class="h-screen flex flex-col justify-between p-6 lg:p-10 ">
          <img src="./images/logo.png" alt="logo" width="100px" class="" />

          <h2 class="text-3xl font-bold leading-tight text-white">
            Welcome to Onasis Links Resources Limited.
          </h2>
        </div>
      </section>

      <!-- right side -->
      <section
        class="flex w-full md:w-1/2 items-center justify-center bg-gray-900 px-6 py-16 md:min-h-screen relative"
      >
      <div class="bg-white/25 inset-0 opacity-40 absolute"></div>
        <div class="w-full max-w-md p-4 z-10">
            <div class=" flex justify-between ">
            <h1 class="text-3xl font-bold text-white">Sign Up</h1>
            <img src="./images/logo.png" alt="logo" width="100px" class="flex md:hidden">
           </div>
          <p class="mt-2 mb-10 text-gray-400">
            Let's sign in quickly to get started.
          </p>

          <!-- form fields -->
          <form class="space-y-4">
            <div class="flex items-center gap-4">
              <div>
                <label class="mb-2 block text-sm text-gray-300">
                  Username
                </label>

                <input
                  type="text"
                  placeholder="Input your username"
                  class="w-full rounded-full border border-gray-700 placeholder:text-sm placeholder:text-gray-700 bg-[#111827] px-5 py-2 text-white outline-none focus:border-violet-500"
                />
              </div>

              <div>
                <label class="mb-2 block text-sm text-gray-300">
                  Email Address
                </label>

                <input
                  type="email"
                  placeholder="example@gmail.com"
                  class="w-full rounded-full border border-gray-700 placeholder:text-sm placeholder:text-gray-700 bg-[#111827] px-5 py-2 text-white outline-none focus:border-violet-500"
                />
              </div>
            </div>

            <div>
              <label class="mb-2 block text-sm text-gray-300"> Password </label>

              <input
                type="password"
                placeholder="********"
                class="w-full rounded-full border border-gray-700 placeholder:text-sm placeholder:text-gray-700 bg-[#111827] px-5 py-2 text-white outline-none focus:border-violet-500"
              />
            </div>
            <div>
              <div class="flex gap-2">
                <div class="h-1 flex-1 rounded bg-green-500"></div>
                <div class="h-1 flex-1 rounded bg-green-500"></div>
                <div class="h-1 flex-1 rounded bg-green-500"></div>
                <div class="h-1 flex-1 rounded bg-gray-700"></div>
              </div>

              <p class="mt-2 text-sm text-gray-400">
                Password strength:
                <span class="text-green-400"> Strong </span>
              </p>
            </div>

            <a href="./signin-form.html">
              <button
                class="w-full rounded-full bg-linear-to-r from-red-500 to-violet-500 py-2 font-semibold text-white transition duration-500 hover:opacity-30 cursor-pointer hover:scale-105"
              >
                Sign up
              </button>
            </a>
          </form>

          <p class="mt-4 text-center text-gray-400">
            Already have an account?
            <a
              href="./signin-form.html"
              class="text-violet-500 hover:underline"
            >
              Sign In.
            </a>
          </p>

          <button
            class="mt-4 flex w-full items-center justify-center gap-3 rounded-full border border-gray-700 bg-[#111827] px-5 py-4 text-white transition hover:bg-gray-900 cursor-pointer"
          >
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#4285F4"
                d="M21.6 12.23c0-.78-.07-1.53-.2-2.25H12v4.26h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 2.98-4.33 2.98-7.53Z"
              />
              <path
                fill="#34A853"
                d="M12 22c2.7 0 4.96-.9 6.62-2.43l-3.24-2.5c-.9.6-2.05.96-3.38.96-2.59 0-4.79-1.75-5.58-4.1H3.07v2.58A10 10 0 0 0 12 22Z"
              />
              <path
                fill="#FBBC05"
                d="M6.42 13.93A6.02 6.02 0 0 1 6.42 10.07V7.49H3.07a10 10 0 0 0 0 12.88l3.35-2.44Z"
              />
              <path
                fill="#EA4335"
                d="M12 6.04c1.46 0 2.77.5 3.8 1.49l2.84-2.84A9.96 9.96 0 0 0 12 2a10 10 0 0 0-8.93 5.49l3.35 2.58c.79-2.35 2.99-4.1 5.58-4.1Z"
              />
            </svg>
            <span>Sign In With Google</span>
          </button>
        </div>
      </section>
    </div>
  </body>
</html>
